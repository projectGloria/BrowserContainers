<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="browserBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <filter id="shadowHeavy" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="480" rx="16" fill="url(#bgGrad)" />

  <!-- Outer Browser Mockup Window -->
  <g transform="translate(40, 30)" filter="url(#shadowHeavy)">
    <!-- Window Frame -->
    <rect width="920" height="420" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

    <!-- Title / Tab Bar -->
    <rect width="920" height="44" rx="12" fill="url(#browserBar)" />
    <!-- Window Controls -->
    <circle cx="24" cy="22" r="6" fill="#ef4444" />
    <circle cx="44" cy="22" r="6" fill="#f59e0b" />
    <circle cx="64" cy="22" r="6" fill="#10b981" />

    <!-- Container Tab 1: Work (Blue) -->
    <g transform="translate(90, 8)">
      <path d="M 0,28 L 0,8 Q 0,0 8,0 L 142,0 Q 150,0 150,8 L 150,28 Z" fill="#1e293b" stroke="#1a73e8" stroke-width="1.5" />
      <!-- Color underline bar -->
      <rect x="0" y="26" width="150" height="3" fill="#1a73e8" />
      <circle cx="16" cy="14" r="5" fill="#1a73e8" />
      <text x="28" y="18" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Work • GitHub (A)</text>
      <text x="136" y="17" fill="#64748b" font-family="sans-serif" font-size="11">×</text>
    </g>

    <!-- Container Tab 2: Personal (Purple) -->
    <g transform="translate(246, 8)">
      <path d="M 0,28 L 0,8 Q 0,0 8,0 L 152,0 Q 160,0 160,8 L 160,28 Z" fill="#1e293b" stroke="#a142f4" stroke-width="1.5" />
      <!-- Color underline bar -->
      <rect x="0" y="26" width="160" height="3" fill="#a142f4" />
      <circle cx="16" cy="14" r="5" fill="#a142f4" />
      <text x="28" y="18" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Personal • GitHub (B)</text>
      <text x="146" y="17" fill="#64748b" font-family="sans-serif" font-size="11">×</text>
    </g>

    <!-- Container Tab 3: Banking (Green) -->
    <g transform="translate(412, 8)">
      <path d="M 0,28 L 0,8 Q 0,0 8,0 L 140,0 Q 148,0 148,8 L 148,28 Z" fill="#1e293b" stroke="#188038" stroke-width="1.5" />
      <!-- Color underline bar -->
      <rect x="0" y="26" width="148" height="3" fill="#188038" />
      <circle cx="16" cy="14" r="5" fill="#188038" />
      <text x="28" y="18" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Finance • Portal</text>
      <text x="134" y="17" fill="#64748b" font-family="sans-serif" font-size="11">×</text>
    </g>

    <!-- Standard Default Tab -->
    <g transform="translate(566, 8)">
      <path d="M 0,28 L 0,8 Q 0,0 8,0 L 120,0 Q 128,0 128,8 L 128,28 Z" fill="#141c2b" stroke="#334155" stroke-width="1" />
      <text x="16" y="18" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Default Browser Tab</text>
      <text x="114" y="17" fill="#64748b" font-family="sans-serif" font-size="11">×</text>
    </g>

    <!-- New Tab + -->
    <text x="706" y="22" fill="#64748b" font-family="sans-serif" font-size="16">+</text>

    <!-- URL Bar / Navigation Header -->
    <g transform="translate(0, 44)">
      <rect width="920" height="42" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <!-- Navigation buttons -->
      <text x="20" y="26" fill="#64748b" font-family="sans-serif" font-size="15">←  →  ↻</text>

      <!-- OmniBox / Address Bar -->
      <rect x="90" y="7" width="670" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="106" y="25" fill="#38bdf8" font-family="monospace" font-size="12">https://github.com/projectGloria/BrowserContainers</text>

      <!-- Container badge in address bar -->
      <rect x="670" y="11" width="80" height="20" rx="4" fill="#1e3a5f" stroke="#1a73e8" stroke-width="1" />
      <circle cx="680" cy="21" r="3.5" fill="#1a73e8" />
      <text x="690" y="25" fill="#93c5fd" font-family="sans-serif" font-size="10" font-weight="600">Work</text>

      <!-- Extension Icon Button (Gloria Containers) -->
      <rect x="772" y="7" width="28" height="28" rx="6" fill="#1e293b" stroke="#1a73e8" stroke-width="1.5" />
      <circle cx="786" cy="21" r="6" fill="#1a73e8" />
      <text x="786" y="24" fill="#fff" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">G</text>
    </g>

    <!-- Browser Viewport / Page Area -->
    <rect x="0" y="86" width="920" height="334" fill="#090d16" />

    <!-- Left Side: Split View Showcase (Two accounts side-by-side) -->
    <!-- Window 1: Work GitHub -->
    <g transform="translate(30, 110)">
      <rect width="410" height="280" rx="8" fill="#0d1117" stroke="#1a73e8" stroke-width="2" filter="url(#cardShadow)" />
      <!-- Header -->
      <rect width="410" height="36" rx="8" fill="#161b22" />
      <circle cx="20" cy="18" r="5" fill="#1a73e8" />
      <text x="32" y="22" fill="#58a6ff" font-family="sans-serif" font-size="12" font-weight="600">Work Container (Cookie Jar A)</text>
      <text x="310" y="22" fill="#3fb950" font-family="sans-serif" font-size="11">● Signed In: @corp-nihil</text>
      <!-- Content mock -->
      <rect x="20" y="55" width="240" height="14" rx="4" fill="#30363d" />
      <rect x="20" y="80" width="370" height="10" rx="3" fill="#21262d" />
      <rect x="20" y="100" width="320" height="10" rx="3" fill="#21262d" />
      <!-- Repos list -->
      <rect x="20" y="125" width="370" height="60" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="34" y="150" fill="#58a6ff" font-family="monospace" font-size="12">internal-infra / microservices</text>
      <text x="34" y="170" fill="#8b949e" font-family="sans-serif" font-size="11">Production cluster configurations • Private</text>
      <!-- Isolation status badge -->
      <rect x="20" y="200" width="370" height="60" rx="6" fill="#0f1f38" stroke="#1f6feb" />
      <text x="34" y="224" fill="#79c0ff" font-family="sans-serif" font-size="11" font-weight="600">🛡️ Scoped declarativeNetRequest Session Rules</text>
      <text x="34" y="244" fill="#8b949e" font-family="sans-serif" font-size="10">Cookies strictly quarantined to Tab #12. Cannot leak to Personal.</text>
    </g>

    <!-- Right Side: Gloria Containers Popup Mockup -->
    <g transform="translate(470, 100)" filter="url(#cardShadow)">
      <rect width="420" height="295" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
      
      <!-- Popup Header -->
      <rect width="420" height="42" rx="10" fill="#21262d" />
      <text x="18" y="26" fill="#f0f6fc" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Gloria Containers</text>
      <rect x="360" y="10" width="46" height="22" rx="4" fill="#30363d" />
      <text x="383" y="25" fill="#c9d1d9" font-family="sans-serif" font-size="10" text-anchor="middle">⚙ Options</text>

      <!-- Active Container Banner -->
      <rect x="14" y="52" width="392" height="34" rx="6" fill="#1f293d" stroke="#388bfd" />
      <circle cx="32" cy="69" r="6" fill="#1a73e8" />
      <text x="46" y="73" fill="#f0f6fc" font-family="sans-serif" font-size="12" font-weight="600">Current Tab: Work</text>
      <text x="310" y="73" fill="#79c0ff" font-family="sans-serif" font-size="11">Reopen ▾</text>

      <!-- Container List Item 1: Work -->
      <g transform="translate(14, 94)">
        <rect width="392" height="40" rx="6" fill="#0d1117" stroke="#30363d" />
        <circle cx="22" cy="20" r="7" fill="#1a73e8" />
        <text x="38" y="24" fill="#f0f6fc" font-family="sans-serif" font-size="12" font-weight="600">Work</text>
        <rect x="290" y="9" width="90" height="22" rx="4" fill="#1f6feb" />
        <text x="335" y="24" fill="#fff" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">+ New Tab</text>
      </g>

      <!-- Container List Item 2: Personal -->
      <g transform="translate(14, 140)">
        <rect width="392" height="40" rx="6" fill="#0d1117" stroke="#30363d" />
        <circle cx="22" cy="20" r="7" fill="#a142f4" />
        <text x="38" y="24" fill="#f0f6fc" font-family="sans-serif" font-size="12" font-weight="600">Personal</text>
        <rect x="290" y="9" width="90" height="22" rx="4" fill="#21262d" stroke="#30363d" />
        <text x="335" y="24" fill="#c9d1d9" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">+ New Tab</text>
      </g>

      <!-- Container List Item 3: Banking -->
      <g transform="translate(14, 186)">
        <rect width="392" height="40" rx="6" fill="#0d1117" stroke="#30363d" />
        <circle cx="22" cy="20" r="7" fill="#188038" />
        <text x="38" y="24" fill="#f0f6fc" font-family="sans-serif" font-size="12" font-weight="600">Banking &amp; Finance</text>
        <rect x="290" y="9" width="90" height="22" rx="4" fill="#21262d" stroke="#30363d" />
        <text x="335" y="24" fill="#c9d1d9" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">+ New Tab</text>
      </g>

      <!-- Bookmarks Picker Quick Launcher -->
      <g transform="translate(14, 234)">
        <rect width="392" height="50" rx="6" fill="#161b22" stroke="#30363d" />
        <text x="14" y="22" fill="#e6edf3" font-family="sans-serif" font-size="11" font-weight="600">🔖 Bookmarks Container Launcher</text>
        <text x="14" y="38" fill="#8b949e" font-family="sans-serif" font-size="10">Search or browse bookmarks and open directly into any container</text>
      </g>
    </g>
  </g>
</svg>
