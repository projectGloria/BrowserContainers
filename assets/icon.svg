<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a20" />
      <stop offset="100%" stop-color="#0c0e12" />
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a73e8" />
      <stop offset="100%" stop-color="#a142f4" />
    </linearGradient>
    <linearGradient id="glow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a142f4" />
      <stop offset="100%" stop-color="#d01884" />
    </linearGradient>
    <linearGradient id="glow3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007b83" />
      <stop offset="100%" stop-color="#188038" />
    </linearGradient>
    <linearGradient id="glow4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fa903e" />
      <stop offset="100%" stop-color="#f9ab00" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)" stroke="#2b313a" stroke-width="4" filter="url(#shadow)" />

  <!-- Outer Ring with Gradient Glow -->
  <rect x="56" y="56" width="400" height="400" rx="84" fill="none" stroke="url(#glow1)" stroke-width="2" opacity="0.4" />

  <!-- Layer 3 / Back Container (Cyan / Green) -->
  <g transform="translate(180, 116) rotate(12)" opacity="0.75">
    <rect width="180" height="230" rx="28" fill="#132426" stroke="url(#glow3)" stroke-width="5" filter="url(#shadow)" />
    <!-- Mini Tab Header -->
    <rect x="18" y="22" width="60" height="12" rx="6" fill="#007b83" />
    <circle cx="146" cy="28" r="8" fill="#188038" />
    <!-- Content mock lines -->
    <rect x="18" y="56" width="144" height="8" rx="4" fill="#007b83" opacity="0.4" />
    <rect x="18" y="74" width="110" height="8" rx="4" fill="#007b83" opacity="0.3" />
  </g>

  <!-- Layer 2 / Mid Container (Purple / Magenta) -->
  <g transform="translate(120, 134) rotate(-6)" opacity="0.9">
    <rect width="200" height="250" rx="30" fill="#1d1428" stroke="url(#glow2)" stroke-width="5" filter="url(#shadow)" />
    <!-- Mini Tab Header -->
    <rect x="20" y="24" width="70" height="14" rx="7" fill="#a142f4" />
    <circle cx="162" cy="31" r="9" fill="#d01884" />
    <!-- Content mock lines -->
    <rect x="20" y="62" width="160" height="10" rx="5" fill="#a142f4" opacity="0.4" />
    <rect x="20" y="82" width="120" height="10" rx="5" fill="#a142f4" opacity="0.3" />
  </g>

  <!-- Layer 1 / Front Focus Container (Blue / Cyan Glow) -->
  <g transform="translate(136, 150)">
    <rect width="240" height="260" rx="32" fill="#111827" stroke="url(#glow1)" stroke-width="6" filter="url(#shadow)" />
    
    <!-- Tab Bar -->
    <path d="M 0,32 Q 0,0 32,0 L 208,0 Q 240,0 240,32 L 240,56 L 0,56 Z" fill="#182235" />
    <rect x="20" y="18" width="80" height="18" rx="9" fill="#1a73e8" />
    <!-- Indicator dots -->
    <circle cx="196" cy="27" r="7" fill="#fa903e" />
    <circle cx="216" cy="27" r="7" fill="#d93025" />
    
    <!-- Isolated Cookie Jar Shield Symbol -->
    <g transform="translate(56, 80)">
      <!-- Shield / Jar Outline -->
      <path d="M 64,12 L 112,32 C 112,80 84,118 64,132 C 44,118 16,80 16,32 Z" fill="#1a253c" stroke="#1a73e8" stroke-width="4" />
      <!-- Cookie Symbol inside Shield -->
      <circle cx="64" cy="72" r="32" fill="#fa903e" />
      <circle cx="54" cy="62" r="4.5" fill="#78350f" />
      <circle cx="74" cy="66" r="4" fill="#78350f" />
      <circle cx="60" cy="82" r="5" fill="#78350f" />
      <circle cx="76" cy="84" r="3.5" fill="#78350f" />
      <!-- Small bite out of cookie -->
      <circle cx="94" cy="62" r="10" fill="#1a253c" />
    </g>

    <!-- Base Status Line -->
    <rect x="28" y="226" width="184" height="8" rx="4" fill="#1a73e8" opacity="0.6" />
  </g>
</svg>
